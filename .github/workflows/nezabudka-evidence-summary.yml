name: Read existing device evidence
on:
  push:
    branches: [assistant/emulator-validation-20261107]
    paths: [.github/workflows/nezabudka-evidence-summary.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect the captured Android16 system-launcher ANR without rerunning an APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42409573186 --repo obermot/alfa --pattern '*api-36-*' --dir reports
          python3 - <<'PY_REPORT'
          from pathlib import Path
          for p in Path('reports').rglob('logcat.txt'):
              lines=p.read_text(errors='replace').splitlines()
              indices=[i for i,l in enumerate(lines) if any(x in l for x in ('ANR in','am_anr','Input dispatching timed out','anr_2026'))]
              print('SYSTEM ANR MATCHES',p,len(indices))
              printed=set()
              for i in indices:
                  for j in range(max(0,i-4),min(len(lines),i+55)):
                      if j not in printed: print(lines[j]);printed.add(j)
          PY_REPORT
