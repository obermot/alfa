name: Read existing device evidence
on:
  push:
    branches: [assistant/emulator-validation-20261107]
    paths: [.github/workflows/nezabudka-evidence-summary.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Display selected synthetic screenshots from existing reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42404787794 --repo obermot/alfa --pattern '*api-26-*' --dir reports
          python3 -m pip install --quiet Pillow
          python3 - <<'PY_REPORT'
          from pathlib import Path
          import base64,io
          from PIL import Image
          names={'fullAlarmSidePaddingContinuesTheOriginalLowerColor','onboardingNamePermissionsInstructionAndFinishWorkOffline'}
          for p in Path('reports').rglob('*.png'):
              if p.stem not in names: continue
              pic=Image.open(p)
              pic.thumbnail((540,1400))
              out=io.BytesIO();pic.save(out,format='PNG')
              data=base64.b64encode(out.getvalue()).decode()
              for i in range(0,len(data),4096): print('DEVICE_PNG',p.name,i//4096,data[i:i+4096])
          PY_REPORT
