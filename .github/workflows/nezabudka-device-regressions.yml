name: Nezabudka Android device regressions

on:
  push:
    branches: [assistant/emulator-validation-20261107]
    paths: ['.github/workflows/nezabudka-device-regressions.yml', 'ci/DEVICE_TEST_REQUEST']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: nezabudka-device-regressions-raster-proof
  cancel-in-progress: true
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEVICE_TEST_FILTER: com.nezabudka.testharness.FinalAlarmDeviceTest#customClockDigitsDoNotSaveAndCloseRejectsPastTime
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Validate requested source SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sed -n 's/^source_sha=//p' control/ci/DEVICE_TEST_REQUEST)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact private source without publishing it
        uses: actions/checkout@v4
        with:
          repository: obermot/Nezabudka
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Prepare disposable emulator signing key and KVM
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ steps.request.outputs.sha }}"
          rm -f source/app/alpha-debug.keystore
          keytool -genkeypair -keystore source/app/alpha-debug.keystore -storepass android -keypass android -alias AndroidDebugKey -dname 'CN=Disposable Emulator Test' -keyalg RSA -keysize 2048 -validity 2
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          python3 -m pip install --quiet Pillow
          mkdir -p evidence
          printf 'source_sha=%s\n' '${{ steps.request.outputs.sha }}' > evidence/provenance.txt
      - name: Fetch official Russian Vosk model for offline instrumentation only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/app/src/androidTest/assets
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o source/app/src/androidTest/assets/vosk-model-small-ru-0.22.zip
          sha256sum source/app/src/androidTest/assets/vosk-model-small-ru-0.22.zip > evidence/test-model.sha256
      - name: Compile app and instrumentation before starting emulator
        working-directory: source
        run: bash ../control/ci/compile-device-checks.sh
      - name: Check delivered APK and expanded Android regressions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, resolved commit
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash control/ci/run-device-regressions.sh
      - name: Summarize compiler, lint and unit results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY_SUMMARY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          p=Path('source/app/build/reports/lint-results-debug.xml')
          if p.exists():
              issues=E.parse(p).getroot().findall('issue')
              from collections import Counter
              print('LINT COUNTS',dict(Counter(i.get('severity') for i in issues)))
              for i in issues:
                  if i.get('severity') in ('Error','Fatal'): print('LINT ERROR',i.get('id'),i.get('message'),[l.attrib for l in i.findall('location')])
          tests=failures=errors=0
          for p in Path('source/app/build/test-results').rglob('TEST-*.xml'):
              r=E.parse(p).getroot()
              tests+=int(r.get('tests',0));failures+=int(r.get('failures',0));errors+=int(r.get('errors',0))
              for case in r.findall('testcase'):
                  for f in case.findall('failure'): print('UNIT FAILURE',case.get('classname'),case.get('name'),f.get('message'))
          print('UNIT COUNTS',tests,failures,errors)
          PY_SUMMARY
      - name: Preserve reports and screenshots only (no sources, APKs, keys or caches)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nezabudka-device-evidence-api-${{ matrix.api }}-${{ steps.request.outputs.sha }}
          path: |
            evidence/
            source/app/build/reports/androidTests/
            source/app/build/reports/lint-results-debug.*
            source/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 3
