name: Nezabudka integration build from private source

on:
  push:
    branches: [main]
    paths:
      - 'ci/INTEGRATION_BUILD_REQUEST'
  workflow_dispatch:

concurrency:
  group: nezabudka-integration-private-source
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact private integration source
        uses: actions/checkout@v4
        with:
          repository: obermot/Nezabudka
          ref: assistant/remaining-integration-20261103
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Confirm integration branch and source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "assistant/remaining-integration-20261103"
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore app/alpha-debug.keystore \
            -storepass android -keypass android -alias AndroidDebugKey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - name: Run full JVM test suite and assemble integration APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nezabudka-integration-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
