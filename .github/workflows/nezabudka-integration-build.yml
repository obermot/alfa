name: Nezabudka integration build from private source

on:
  push:
    branches: [main]
    paths:
      - 'ci/INTEGRATION_BUILD_REQUEST'
  workflow_dispatch:

concurrency:
  group: nezabudka-integration-private-source
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact private integration source
        uses: actions/checkout@v4
        with:
          repository: obermot/Nezabudka
          ref: assistant/remaining-integration-20261103
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Confirm integration branch and source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "assistant/remaining-integration-20261103"
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/alpha-debug.keystore
          keytool -genkeypair -v -keystore app/alpha-debug.keystore \
            -storepass android -keypass android -alias AndroidDebugKey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - name: Run full JVM test suite and assemble integration APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nezabudka-integration-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual first-screen Android rendering
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.nezabudka.testharness/.FinalMainActivity
            sleep 12
            mkdir -p build/visual-screenshots
            adb shell screencap -p /sdcard/nezabudka_screen_01.png
            adb pull /sdcard/nezabudka_screen_01.png build/visual-screenshots/screen_01_android.png
      - name: Upload actual Android first-screen screenshot
        uses: actions/upload-artifact@v4
        with:
          name: nezabudka-android-screen-01
          path: build/visual-screenshots/screen_01_android.png
          if-no-files-found: error
          retention-days: 7
