name: Nezabudka integration build from private source

on:
  push:
    branches: [main]
    paths:
      - 'ci/INTEGRATION_BUILD_REQUEST'
  workflow_dispatch:

concurrency:
  group: nezabudka-integration-private-source
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out CI request from triggering commit
        uses: actions/checkout@v4
        with:
          path: ci-request
          persist-credentials: false
      - name: Validate and pin requested private source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          request=ci-request/ci/INTEGRATION_BUILD_REQUEST
          sha="$(sed -n 's/^source_sha=//p' "$request" | tail -n 1)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set source_sha=<40-character commit SHA> in ci/INTEGRATION_BUILD_REQUEST"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned private source SHA: $sha"
      - name: Check out exact private integration source
        uses: actions/checkout@v4
        with:
          repository: obermot/Nezabudka
          ref: ${{ steps.source.outputs.sha }}
          path: source
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Confirm exact source revision
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent development signing key
        uses: actions/cache@v4
        with:
          path: source/app/alpha-debug.keystore
          key: nezabudka-debug-signing-key-v1
      - name: Generate development signing key only on first build
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          if test -s app/alpha-debug.keystore; then echo 'Using persistent development signing key'; exit 0; fi
          keytool -genkeypair -v -keystore app/alpha-debug.keystore \
            -storepass android -keypass android -alias AndroidDebugKey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - name: Assemble requested debug APK (tests tracked separately)
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nezabudka-integration-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

