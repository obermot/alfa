name: Nezabudka integration build from private source

on:
  push:
    branches: [main]
    paths:
      - 'ci/INTEGRATION_BUILD_REQUEST'
  workflow_dispatch:

concurrency:
  group: nezabudka-integration-private-source
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact private integration source
        uses: actions/checkout@v4
        with:
          repository: obermot/Nezabudka
          ref: assistant/remaining-integration-20261103
          token: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Confirm integration branch and source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "assistant/remaining-integration-20261103"
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Export original CorelDRAW page 1 as Android bitmap
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.NEZABUDKA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-draw poppler-utils
          mkdir -p /tmp/cdr-export
          libreoffice -env:UserInstallation=file:///tmp/lo-nezabudka-visual --headless --convert-to pdf --outdir /tmp/cdr-export "Исходники/зкраны для программирования.cdr"
          pdftoppm -f 1 -singlefile -scale-to-x 1080 -scale-to-y 2340 -png /tmp/cdr-export/*.pdf /tmp/cdr-export/nezabudka_screen01
          mkdir -p app/src/main/assets
          cp /tmp/cdr-export/nezabudka_screen01.png app/src/main/assets/corel_screen01_original.png
      - name: Restore persistent development signing key
        uses: actions/cache@v4
        with:
          path: app/alpha-debug.keystore
          key: nezabudka-debug-signing-key-v1
      - name: Generate development signing key only on first build
        shell: bash
        run: |
          set -euo pipefail
          if test -s app/alpha-debug.keystore; then echo 'Using persistent development signing key'; exit 0; fi
          keytool -genkeypair -v -keystore app/alpha-debug.keystore \
            -storepass android -keypass android -alias AndroidDebugKey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - name: Run full JVM test suite and assemble integration APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nezabudka-integration-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

